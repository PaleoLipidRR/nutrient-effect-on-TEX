name: nutrient-effect-on-tex
channels:
  - conda-forge
channel_priority: strict

dependencies:
  # --- Core & Environment ---
  - python=3.10
  - pip
  - jupyterlab
  - ipywidgets
  - tqdm

  # --- Core Scientific Stack ---
  - numpy
  - pandas
  - openpyxl
  - scipy
  - scikit-learn
  - statsmodels
  - seaborn
  
  # --- Core Data Handling ---
  - xarray
  - dask
  - distributed
  - zarr
  - netcdf4
  - h5netcdf
  - cftime

  # --- Plotting (Stable Pinned Versions) ---
  # NOTE: Multiple pins here increase solver complexity.
  - matplotlib<3.5
  - proplot=0.9.7
  - setuptools<81
  - cmocean
  - plotly
  - pygmt
  
  # --- Geo Stack (Complex Dependencies) ---
  # NOTE: shapely<2 is a major constraint.
  - geopandas
  - shapely
  - pyproj
  - cartopy
  - pyogrio
  - mapclassify
  - rtree
  - geopy
  - pyshp=2.3.*

  # --- xESMF Stack (Complex Dependencies) ---
  - xesmf
  - esmpy
  - esmf
  - hdf5
  - libnetcdf

  # --- Stan & Other Tools ---
  - cmdstanpy>=1.0
  - stanio
  - typing-extensions
  - anywidget
  - ipylab
  - duckdb
  - pyarrow
  - sqlalchemy
  - pydantic
  - importlib-metadata<5.0

  # --- Pip-only packages & Local Install ---
  - pip:
    - baysplinepy
    - baysparpy
    - pygwalker